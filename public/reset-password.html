<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>帳號密碼 · 藝術設計部</title><link rel="icon" href="/favicon.svg"><style>
@font-face{font-family:Line;src:url('/fonts/LINESeedTW_Rg.woff2')}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 85% 10%,#bed5f5,transparent 60%),radial-gradient(ellipse at 10% 80%,#c7e2e7,transparent 60%),#edf3fa;color:#233b56;font:15px Line,system-ui,sans-serif}main{width:min(440px,100%);padding:32px;background:rgba(255,255,255,.75);border:1px solid white;border-radius:20px;box-shadow:0 24px 70px #315e9a16;backdrop-filter:blur(18px)}small,p{color:#526983;line-height:1.8}small{display:block}h1{font-size:24px;margin:12px 0}label{display:block;font-size:13px;margin:18px 0}input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #c9d7e8;border-radius:8px;background:#fff;font:inherit}button{width:100%;padding:12px;border:0;border-radius:8px;background:#315ea8;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:#315ea8}#message{font-size:13px;line-height:1.8;overflow-wrap:anywhere}a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid #315ea8;outline-offset:3px}@media(max-width:400px){body{padding:16px}main{padding:22px}}
</style></head><body><main><small>◇ 藝術設計部 · 帳號安全</small><h1 id="title">忘記密碼</h1><p id="intro">輸入帳號 Email，取得限時重設連結。</p><form id="form"><div id="fields"></div><button id="submit" type="submit">寄送重設連結</button></form><p id="message" role="status" aria-live="polite"></p><a href="/login">返回登入</a></main><script>
(() => {
  const reset=location.pathname.includes('reset-password');
  // Fragment keeps the bearer token out of HTTP paths and referrer headers.
  const token=location.hash.slice(1);if(reset)history.replaceState(null,'',location.pathname);
  const form=document.getElementById('form'),message=document.getElementById('message'),button=document.getElementById('submit');
  const api=async(path,body)=>{const r=await fetch('/api/auth/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.message||'目前無法處理，請稍後再試');return d;};
  if(reset){
    document.getElementById('title').textContent='設定新密碼';document.getElementById('intro').textContent='至少 10 字，包含大小寫英文字母與數字。成功後請重新登入。';
    document.getElementById('fields').innerHTML='<label>新密碼<input name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label><label>再次輸入新密碼<input name="confirmation" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label>';
    button.textContent='更新密碼';button.disabled=true;
    api('reset-password/check',{token}).then(()=>button.disabled=false).catch(e=>{message.textContent=e.message;form.hidden=true;});
  }else{
    document.getElementById('fields').innerHTML='<label>帳號 Email<input name="email" type="email" maxlength="254" autocomplete="username" required></label>';
    button.disabled=true;api('recovery-status').then(d=>{if(d.emailAvailable){button.disabled=false;}else{message.textContent='目前尚未啟用重設信件寄送，請聯絡管理員取得限時重設連結。';form.hidden=true;}}).catch(e=>{message.textContent=e.message;});
  }
  form.onsubmit=async e=>{
    e.preventDefault();message.textContent='處理中…';button.disabled=true;
    const values=Object.fromEntries(new FormData(form));
    if(reset&&values.password!==values.confirmation){message.textContent='兩次新密碼不一致';button.disabled=false;return;}
    try{const d=await api(reset?'reset-password':'forgot-password',reset?{token,...values}:values);message.textContent=d.message;form.hidden=true;}catch(error){message.textContent=error.message;button.disabled=false;}
  };
})();
</script></body></html>
