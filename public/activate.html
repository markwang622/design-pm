<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設定密碼 · 藝術設計部專案管理</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;500;700&display=swap">
  <style>
    @font-face {
      font-family: 'LINE Seed Sans';
      src: url('/fonts/LINESeedSans_Rg.otf') format('opentype');
      font-weight: 100 400; font-style: normal; font-display: swap;
      unicode-range: U+0020-024F, U+2000-206F, U+20A0-20BF, U+2122, U+2190-21FF, U+2200-22FF, U+25A0-25FF, U+2600-27BF;
    }
    @font-face {
      font-family: 'LINE Seed Sans';
      src: url('/fonts/LINESeedSans_Bd.otf') format('opentype');
      font-weight: 401 800; font-style: normal; font-display: swap;
      unicode-range: U+0020-024F, U+2000-206F, U+20A0-20BF, U+2122, U+2190-21FF, U+2200-22FF, U+25A0-25FF, U+2600-27BF;
    }
    @font-face {
      font-family: 'LINE Seed TW';
      src: url('/fonts/LINESeedTW_Rg.woff2') format('woff2');
      font-weight: 100 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'LINE Seed TW';
      src: url('/fonts/LINESeedTW_Bd.woff2') format('woff2');
      font-weight: 401 800; font-style: normal; font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-grad: linear-gradient(135deg, #EDF2F9 0%, #F0F1FA 100%);
      --card-bg: rgba(255,255,255,0.62);
      --glass-border: rgba(255,255,255,0.7);
      --accent: #4A6FA5;
      --blob1: rgba(91,131,184,0.26); --blob2: rgba(126,143,192,0.22);
      --fg: #1A1A1A;
      --fg-sub: #8C8C8C;
      --fg-muted: #444;
      --input-bg: rgba(255,255,255,0.7);
      --input-border: #D4D4D4;
      --btn-bg: var(--accent);
      --btn-fg: #FFF;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --card-bg: rgba(26,32,43,0.55);
      --glass-border: rgba(255,255,255,0.10);
      --fg: #E8E8E8;
      --fg-sub: #9BA3AD;
      --fg-muted: #A0A0A0;
      --input-bg: rgba(15,20,25,0.6);
      --input-border: #3A4048;
      --btn-fg: #0F1419;
    }
    /* 四季背景 + accent（依月份自動，與主系統一致） */
    [data-season="spring"] { --bg-grad: linear-gradient(135deg,#FCEAF0 0%,#F4F7EC 50%,#E9F5F0 100%); --accent:#C9577C; --blob1:rgba(232,131,158,0.30); --blob2:rgba(123,179,137,0.26); }
    [data-season="spring"][data-theme="dark"] { --bg-grad: linear-gradient(135deg,#1A1117 0%,#14130F 55%,#101512 100%); --accent:#E27EA0; --blob1:rgba(217,107,146,0.22); --blob2:rgba(110,160,120,0.18); }
    [data-season="summer"] { --bg-grad: linear-gradient(135deg,#E6F4FB 0%,#E9F0FF 50%,#E4FAF5 100%); --accent:#1A93B0; --blob1:rgba(31,168,199,0.28); --blob2:rgba(99,140,235,0.22); }
    [data-season="summer"][data-theme="dark"] { --bg-grad: linear-gradient(135deg,#0B1820 0%,#0C1119 55%,#0A1518 100%); --accent:#38C0DC; --blob1:rgba(43,168,196,0.22); --blob2:rgba(99,140,235,0.18); }
    [data-season="autumn"] { --bg-grad: linear-gradient(135deg,#FCEEDE 0%,#FBE6D6 50%,#F7EAD7 100%); --accent:#C26A22; --blob1:rgba(215,122,43,0.28); --blob2:rgba(192,86,59,0.22); }
    [data-season="autumn"][data-theme="dark"] { --bg-grad: linear-gradient(135deg,#1E1610 0%,#17110C 55%,#1A130D 100%); --accent:#DD9148; --blob1:rgba(225,162,78,0.20); --blob2:rgba(200,100,60,0.18); }
    [data-season="winter"] { --bg-grad: linear-gradient(135deg,#EDF2F9 0%,#F0F1FA 50%,#E9F1F6 100%); --accent:#4A6FA5; --blob1:rgba(91,131,184,0.26); --blob2:rgba(126,143,192,0.22); }
    [data-season="winter"][data-theme="dark"] { --bg-grad: linear-gradient(135deg,#0D131C 0%,#0B0F16 55%,#0C1118 100%); --accent:#7FA8D8; --blob1:rgba(110,151,207,0.20); --blob2:rgba(126,143,192,0.18); }
    html, body { height: 100%; font-family: "LINE Seed Sans", "LINE Seed TW", "Chiron Hei HK", -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--fg); }
    body {
      background: var(--bg-grad);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.4s, color 0.3s;
    }
    body::before {
      content:''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(42% 52% at 16% 18%, var(--blob1, transparent) 0%, transparent 70%),
        radial-gradient(48% 58% at 84% 84%, var(--blob2, transparent) 0%, transparent 72%);
    }
    .card {
      position: relative; z-index: 1;
      background: var(--card-bg); padding: 40px 36px; border-radius: 16px;
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
      box-shadow: 0 8px 40px rgba(31,41,61,0.16);
      width: 360px; max-width: calc(100vw - 32px);
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; color: var(--fg); letter-spacing: 0.3px; }
    .sub { font-size: 12px; color: var(--fg-sub); margin-bottom: 28px; }
    label { display: block; font-size: 12px; color: var(--fg-muted); margin: 12px 0 6px; font-weight: 500; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 4px;
      font-size: 14px; font-family: inherit; background: var(--input-bg); color: var(--fg);
    }
    input:focus { outline: 2px solid var(--btn-bg); outline-offset: -1px; }
    button {
      width: 100%; margin-top: 20px; padding: 10px; background: var(--btn-bg); color: var(--btn-fg);
      border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer;
      font-family: inherit;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .err { color: #D8504F; font-size: 12px; margin-top: 12px; display: none; }
    .err.show { display: block; }
    .hint { font-size: 11px; color: var(--fg-sub); margin-top: 16px; text-align: center; line-height: 1.6; }
    .brand { font-size: 11px; color: #BBB; text-align: center; margin-top: 20px; }
    @media (max-width: 480px) {
      .card { padding: 28px 22px; }
    }
  </style>
  <script>
    // Apply saved theme immediately to avoid flash
    try {
      const t = localStorage.getItem('design-pm-theme') || 'auto';
      const eff = t === 'auto'
        ? ((new Date().getHours() >= 18 || new Date().getHours() < 6) ||
           (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
        : t;
      document.documentElement.setAttribute('data-theme', eff);
      // 季節：依偏好或月份自動
      const sPref = localStorage.getItem('design-pm-season') || 'auto';
      let season = sPref;
      if (sPref === 'auto') {
        const m = new Date().getMonth();
        season = (m >= 2 && m <= 4) ? 'spring' : (m >= 5 && m <= 7) ? 'summer' : (m >= 8 && m <= 10) ? 'autumn' : 'winter';
      }
      document.documentElement.setAttribute('data-season', season);
    } catch {}
  </script>

  <style>
    .req { list-style: none; margin: 10px 0 0; font-size: 11px; color: var(--fg-sub); }
    .req li { padding: 2px 0; }
    .req li::before { content: '○ '; }
    .req li.ok { color: #2E9B5B; }
    .req li.ok::before { content: '✓ '; }
    .who { font-size: 12px; color: var(--fg-muted); background: rgba(127,127,127,0.10);
           border-radius: 6px; padding: 9px 11px; margin-bottom: 4px; line-height: 1.7; }
    .who b { color: var(--fg); }
    .state { text-align: center; padding: 10px 0; }
    .state h1 { margin-bottom: 10px; }
    .state p { font-size: 13px; color: var(--fg-muted); line-height: 1.8; }
    .state a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading" class="state"><p>檢查連結中…</p></div>

    <div id="bad" class="state" style="display:none;">
      <h1>連結無法使用</h1>
      <p id="bad-msg"></p>
      <p style="margin-top:14px;font-size:12px;">請聯絡系統管理員重新產生啟用連結。</p>
      <p style="margin-top:10px;"><a href="/login">回登入頁</a></p>
    </div>

    <form id="form" style="display:none;">
      <h1>設定你的登入密碼</h1>
      <div class="sub">首次使用請自行設定密碼，設定後即可登入</div>
      <div class="who" id="who"></div>

      <label for="pw">新密碼</label>
      <input id="pw" type="password" autocomplete="new-password" required autofocus>
      <ul class="req">
        <li id="r-len">至少 10 個字元</li>
        <li id="r-upper">包含大寫英文字母</li>
        <li id="r-lower">包含小寫英文字母</li>
        <li id="r-digit">包含至少一個數字</li>
      </ul>

      <label for="pw2">再次輸入新密碼</label>
      <input id="pw2" type="password" autocomplete="new-password" required>

      <button type="submit" id="submit">設定密碼並登入</button>
      <div class="err" id="err"></div>
      <div class="hint">此連結僅能使用一次，設定完成後即失效。</div>
    </form>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const $ = (id) => document.getElementById(id);
    const show = (id) => { ['loading','bad','form'].forEach(x => $(x).style.display = x === id ? (x === 'form' ? 'block' : 'block') : 'none'); };
    const fail = (msg) => { $('bad-msg').textContent = msg; show('bad'); };

    // 密碼規則即時檢查（與後端 validatePasswordStrength 一致）
    const rules = {
      'r-len':   (v) => v.length >= 10,
      'r-upper': (v) => /[A-Z]/.test(v),
      'r-lower': (v) => /[a-z]/.test(v),
      'r-digit': (v) => /\d/.test(v),
    };
    function checkRules() {
      const v = $('pw').value;
      let all = true;
      for (const id in rules) {
        const ok = rules[id](v);
        $(id).classList.toggle('ok', ok);
        if (!ok) all = false;
      }
      return all;
    }

    (async function init() {
      if (!token) return fail('這個網址缺少啟用碼，請確認連結是否完整複製。');
      try {
        const r = await fetch('/api/auth/activation/' + encodeURIComponent(token));
        const d = await r.json().catch(() => ({}));
        if (!r.ok) return fail(d.message || '連結無效或已被使用。');
        $('who').innerHTML = '帳號：<b>' + d.email + '</b><br>姓名：<b>' + d.name + '</b>';
        show('form');
        $('pw').addEventListener('input', checkRules);
      } catch (e) {
        fail('無法連線到伺服器，請稍後再試。');
      }
    })();

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = $('err'), btn = $('submit');
      err.classList.remove('show');
      const pw = $('pw').value, pw2 = $('pw2').value;
      if (!checkRules()) { err.textContent = '密碼不符合上方所有條件'; err.classList.add('show'); return; }
      if (pw !== pw2) { err.textContent = '兩次輸入的密碼不一致'; err.classList.add('show'); return; }
      btn.disabled = true; btn.textContent = '設定中…';
      try {
        const r = await fetch('/api/auth/activate', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.message || d.error || '設定失敗');
        location.replace('/');
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('show');
        btn.disabled = false; btn.textContent = '設定密碼並登入';
      }
    });
  </script>
</body>
</html>
