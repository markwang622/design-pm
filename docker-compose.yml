# ── Local-dev Postgres + app ──────────────────────────────────
# Usage:
#   docker compose up --build
#   open http://localhost:3000/login → mark@company.com / design2026!
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: design_pm
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/design_pm?schema=public
      JWT_SECRET: local-dev-secret-change-me-before-prod
      NODE_ENV: production
      PORT: "3000"
      SEED_DEFAULT_PASSWORD: design2026!
      SEED_ADMIN_EMAIL: mark@company.com
    ports:
      - "3000:3000"

volumes:
  db-data:
